[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpulse-ai"
version = "0.1.0"
description = "AI-powered job search and application tracking platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kushal Bendale" }
]

dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.32.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]